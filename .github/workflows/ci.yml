name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.26.x", stable]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - name: Tests avec le détecteur de concurrence
        run: go test -race -coverprofile=cover.out ./...
      - name: Couverture
        run: go tool cover -func=cover.out | tail -1
      - name: Les benchmarks tournent
        run: go test -run='^$' -bench=. -benchtime=100x ./internal/proxy ./internal/gateway

  lint:
    name: Analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  fuzz:
    name: Fuzzing court
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -run='^$' -fuzz=FuzzParseFrame -fuzztime=20s ./internal/jsonrpc
      - run: go test -run='^$' -fuzz=FuzzReader -fuzztime=20s ./internal/sse
      - run: go test -run='^$' -fuzz=FuzzScanJSON -fuzztime=20s ./internal/secrets
      - run: go test -run='^$' -fuzz='FuzzScan$' -fuzztime=20s ./internal/detect

  build:
    name: Compilation des six plateformes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make dist
      - run: cat dist/SHA256SUMS

  image:
    name: Image conteneur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Construire l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: vigie:ci
          build-args: VERSION=ci
      - name: L'image démarre et refuse d'écouter sans authentification
        run: |
          docker run --rm vigie:ci version
          mkdir -p /tmp/vigie && printf 'version: 1\nservers:\n  billing:\n    url: https://billing.example/mcp\n' > /tmp/vigie/vigie.yaml
          if docker run --rm -v /tmp/vigie:/etc/vigie:ro vigie:ci 2> err.txt; then exit 1; fi
          grep -q "add gateway.tokens" err.txt

  demo:
    name: Démo et SDK MCP officiels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/compat/package-lock.json
      - name: La démo se joue jusqu'au bout
        run: make demo
      - name: Vigie entre les SDK TypeScript v1 et v2, en stdio et en HTTP, dans les deux ères du protocole
        run: make compat

  conformance:
    name: Suite de conformance MCP à travers la passerelle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Chaque scénario réussi en direct réussit à travers Vigie (2025-11-25 et 2026-07-28)
        run: make conformance

  sonde:
    name: Intégration Sonde dans ClickHouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: OlivMartins/sonde
          path: sonde
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install chdb pyyaml
      - name: Liste blanche et requêtes de docs/sonde.md sur le schéma de Sonde
        run: make sonde-check SONDE=sonde
