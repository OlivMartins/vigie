version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /test/compat
    schedule:
      interval: weekly
    groups:
      mcp-sdks:
        patterns: ["@modelcontextprotocol/*", "sdk-v1"]
